<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RetroArch</title>
<link rel="icon" href="data:,">
<!-- Player do RetroArch web (nightly do buildbot) para o R36S no navegador.
     play.html?system=snes&core=snes9x&rom=/roms/snes/<arquivo>
     Sozinho: abre e roda. Dentro do ES (web/bridge.js): avisa o pai com postMessage({type:"r36s-exit"}) ao sair. -->
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  /* tamanho por CSS (o RetroArch reclama se for por atributo); 4:3 como a tela do R36S */
  #canvas{display:block;margin:auto;height:100%;width:auto;aspect-ratio:4/3;max-width:100%;outline:none}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
       color:#ccc;font:16px system-ui;text-align:center;padding:24px;pointer-events:none}
  #msg.err{color:#f88}
  #msg small{color:#888}
  #sync{position:fixed;right:8px;bottom:6px;color:#f88;font:12px system-ui;display:none}
</style>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="msg">carregando…</div>
<div id="sync"></div>
<script type="module" src="play.js"></script>
</html>
