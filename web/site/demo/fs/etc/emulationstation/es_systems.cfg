<?xml version="1.0"?>
<!-- Modo demonstração do R36S Web: só os sistemas dos homebrews livres (web/site/demo/LICENSES.md).
     Comandos no formato do dArkOS (a ponte web/bridge.js lê o núcleo de -L .../<core>_libretro.so e a ROM). -->
<systemList>
	<system>
		<name>nes</name>
		<fullname>NES</fullname>
		<path>/roms/nes/</path>
		<extension>.nes .NES</extension>
		<command>nice -n -19 /usr/local/bin/retroarch -L /home/ark/.config/retroarch/cores/nestopia_libretro.so %ROM%</command>
		<platform>nes</platform>
		<theme>nes</theme>
	</system>
	<system>
		<name>gbc</name>
		<fullname>Game Boy Color</fullname>
		<path>/roms/gbc/</path>
		<extension>.gb .GB .gbc .GBC</extension>
		<command>nice -n -19 /usr/local/bin/retroarch -L /home/ark/.config/retroarch/cores/gambatte_libretro.so %ROM%</command>
		<platform>gbc</platform>
		<theme>gbc</theme>
	</system>
</systemList>
