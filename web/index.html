<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>R36S</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="controls.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #canvas{display:block;margin:auto;height:100% !important;width:auto !important;aspect-ratio:4/3;max-width:100%;image-rendering:auto;outline:none}
  #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:10}
  #status{position:fixed;left:8px;bottom:8px;color:#888;font:12px system-ui}
  #status.err{color:#ffd23f;font-size:15px;line-height:1.5;left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);max-width:min(560px,90vw);padding:16px 20px;background:#1b1446;border:3px solid #ff2e88;z-index:60}
  /* aviso da ponte (sistema sem emulador no navegador): por cima do ES por alguns segundos */
  #notice{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;max-width:80%;padding:18px 26px;border-radius:10px;
          background:rgba(20,20,24,.92);color:#eee;font:18px system-ui;text-align:center;box-shadow:0 4px 30px #000;pointer-events:none}
  #notice small{display:block;margin-top:6px;color:#aaa;font-size:13px}
  /* jogo com threads (PSP) no site: roda numa aba isolada (bridge.js isolatedGame); aviso fixo enquanto isso */
  #isolated{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;max-width:80%;padding:20px 28px;border-radius:10px;
            background:rgba(20,20,24,.94);color:#eee;font:18px system-ui;text-align:center;box-shadow:0 4px 30px #000}
  #isolated small{display:block;margin:8px 0 14px;color:#aaa;font-size:13px}
  #isolated button{margin:0 6px;padding:8px 14px;border:0;border-radius:6px;background:#ffd23f;color:#1b1446;font:600 14px system-ui;cursor:pointer}
  #isolated button:last-child{background:#444;color:#eee}
</style>
<!-- id "canvas": o port SDL2 registra os handlers em #canvas -->
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">carregando…</div>
<script type="module">
  import createES from "./emulationstation.js";
  import { bootFS } from "./fsboot.js";
  import { installBridge, keepFocus } from "./bridge.js";
  import { installControls } from "./controls.js";
  import { createIO } from "./io.js";
  const t0 = performance.now();
  const status = document.getElementById("status");
  // erro fatal na tela (no celular não há console): o que, onde, e o aparelho/navegador, para mandar por print
  const showFatal = (what, e) => {
    if (window.r36s && window.r36s.error) return;   // já tem uma explicação na tela (ex.: sem WebGL)
    const msg = String(e && (e.message || e) || e).slice(0, 300), where = String(e && e.stack || "").split("\n").slice(0, 3).join(" | ").slice(0, 300);
    status.className = "err";
    status.textContent = `Erro: ${what}. ${msg}${where ? " — " + where : ""} — ${navigator.userAgent.replace(/^Mozilla\/5.0 /, "").slice(0, 120)}`;
    if (window.r36s) window.r36s.error = msg;
  };
  addEventListener("error", e => { if (!(window.r36s && window.r36s.ready)) showFatal("erro ao iniciar", e.error || e.message); });
  addEventListener("unhandledrejection", e => { if (!(window.r36s && window.r36s.ready)) showFatal("erro ao iniciar", e.reason); });
  const canvas = document.getElementById("canvas");
  // backend de arquivos: hub (padrão: fs/, saves/ e data/ do hub local) ou, aberto pelo site (web/site/), drive/demo
  const backend = new URLSearchParams(location.search).get("backend") || "hub";
  const site = (() => { try { return parent !== window ? parent.r36sSite : null; } catch (e) { return null; } })();
  if (backend !== "hub" && !site) {
    status.textContent = "abra pelo site (site/) para usar o Google Drive"; status.className = "err";
    throw new Error("backend " + backend + " sem o site");
  }
  const io = backend === "hub" ? null : createIO({ backend, site });
  window.r36s = { ready: false, t0, backend, io };
  keepFocus(canvas);   // antes de tudo: a primeira tecla não se perde mesmo sem clicar
  installControls({ canvas, siteMode: !!site, site });   // painel de comandos, toque, controles, 2 jogadores
  // sem WebGL (o Chrome bloqueia o 3D depois de travamentos da GPU, ou driver fora da lista) o SDL falha com
  // "EGL_BAD_MATCH" e o ES quebra no primeiro glClearColor: testa num canvas à parte e explica o que fazer
  const probe = document.createElement("canvas").getContext("webgl", { depth: true, stencil: true });
  if (!probe) {
    status.className = "err";
    status.textContent = "O navegador não liberou o 3D (WebGL). Feche o navegador por completo e abra de novo. " +
      "Se continuar: no Chrome, abra chrome://gpu e veja se WebGL está \"Hardware accelerated\"; " +
      "em Configurações > Sistema, ligue \"Usar aceleração de hardware\".";
    window.r36s.error = "sem WebGL";
    throw new Error("WebGL indisponível");
  }
  const lose = probe.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();   // devolve o contexto
  const Module = await createES({
    canvas,
    thisProgram: "/usr/bin/emulationstation/emulationstation",   // ES acha resources/ ao lado do executável
    print: t => console.log("[es]", t),
    printErr: t => console.warn("[es]", t),
    locateFile: f => f,
  });
  const info = await bootFS(Module, io ? io.fetchFrom(location.href) : undefined);
  status.textContent = `${info.files} arquivos (${info.lazy} sob demanda)`;
  // cartão desmontado (o hub responde 503 em fs/roms/...): o ES abre com as listas, mas mídia e jogos não carregam
  const card = io ? 200 : await fetch("fs/roms/bios/", { method: "HEAD" }).then(r => r.status, () => 0);
  if (card === 503) { status.textContent = "cartão não montado: capas e jogos indisponíveis"; status.className = "err"; }
  Module.ENV.HOME = "/home/ark";
  Object.assign(window.r36s, { Module, fs: info });
  await installBridge(Module, canvas);   // Module.webLaunch: jogo no RetroArch (iframe retroarch/play.html); lê data/cores.json
  canvas.focus();
  // resolução do R36S (640x480) vem do shim de display (es-core/src/web/go2_web.cpp)
  try { Module.callMain(["--home", "/home/ark"]); }
  catch (e) { showFatal("o ES parou ao iniciar", e); throw e; }
  window.r36s.ready = true;
  window.r36s.readyMs = Math.round(performance.now() - t0);
  if (card !== 503) setTimeout(() => status.remove(), 3000);
</script>
</html>
